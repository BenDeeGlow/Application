<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome – Professional Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            overflow: hidden;
            height: 100vh;
        }

        /* ── Background photo fills screen ── */
        .bg-image {
            position: fixed;
            inset: 0;
            background-image: url('Scratch.png');
            background-size: cover;
            background-position: center top;
            z-index: 0;
        }

        /* ── Gradient overlay to mask baked-in text in photo ── */
        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    to bottom,
                    transparent 30%,
                    rgba(0, 20, 35, 0.72) 42%,
                    rgba(0, 20, 35, 0.80) 55%,
                    rgba(0, 20, 35, 0.72) 68%,
                    transparent 80%
                );
        }

        /* ── Revealed content ── */
        .reveal-content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
        }

        .reveal-logo {
            width: 175px;
            height: 175px;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: scale(0.85);
            transition: all 0.9s ease;
            object-fit: contain;
            filter: brightness(1.6) saturate(0.7) drop-shadow(0 1px 4px rgba(0,0,0,0.3));
        }
        .reveal-logo.show { opacity: 1; transform: scale(1); }

        .headline {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.9s ease 0.2s;
            pointer-events: none;
        }
        .headline.show { opacity: 1; transform: translateY(0); }

        .headline h2 {
            font-size: clamp(1.8rem, 3.2vw, 3rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 20px rgba(0,0,0,0.6), 0 1px 4px rgba(0,0,0,0.5);
            margin-bottom: 0.3rem;
        }
        .headline h2 span { display: block; }

        .reveal-subtitle {
            font-size: clamp(0.9rem, 1.4vw, 1.2rem);
            color: rgba(255,255,255,0.75);
            margin-top: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }

        .enter-btn {
            margin-top: 2.5rem;
            padding: 1rem 2.8rem;
            background: #002e3d;
            color: #fcd202;
            border: 2px solid #fcd202;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            transition: background 0.3s, color 0.3s, transform 0.3s,
                        opacity 0.9s ease 0.5s, transform 0.9s ease 0.5s;
            pointer-events: none;
        }
        .enter-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .enter-btn:hover { background: #e8c800; color: #002e3d; transform: scale(1.04); }

        /* ── Scratch canvas ── */
        #scratch-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 10;
        }

        /* ── "Scratch to Reveal" hints ── */
        .scratch-hint {
            position: fixed;
            z-index: 12;
            pointer-events: none;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(1.1rem, 2.4vw, 2rem);
            font-weight: 700;
            color: rgba(8, 8, 8, 0.82);
            text-shadow: 0 1px 6px rgba(255,255,255,0.1);
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
            transition: opacity 0.5s ease;
        }

        /* top-left quadrant, ~20° tilt, shifted left */
        .scratch-hint-left {
            top: 25%;
            left: 18%;
            transform: translate(-50%, -50%) rotate(-20deg);
            animation: hintPulseLeft 2.4s ease-in-out infinite;
        }

        /* top-right quadrant, ~20° tilt */
        .scratch-hint-right {
            top: 25%;
            left: 72%;
            transform: translate(-50%, -50%) rotate(20deg);
            animation: hintPulseRight 2.4s ease-in-out infinite 0.35s;
        }

        .scratch-hint.hidden { opacity: 0 !important; animation: none; }

        @keyframes hintPulseLeft {
            0%, 100% { opacity: 0.82; transform: translate(-50%,-50%) rotate(-20deg) scale(1); }
            50%       { opacity: 1;   transform: translate(-50%,-50%) rotate(-20deg) scale(1.07); }
        }
        @keyframes hintPulseRight {
            0%, 100% { opacity: 0.82; transform: translate(-50%,-50%) rotate(20deg) scale(1); }
            50%       { opacity: 1;   transform: translate(-50%,-50%) rotate(20deg) scale(1.07); }
        }

        /* ── "Warum nicht auch meine" — subtle grey ── */
        .scratch-text {
            position: fixed;
            z-index: 13;
            pointer-events: none;
            bottom: 13%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 80%;
            transition: opacity 0.8s ease;
        }
        .scratch-text .line1 {
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(1.1rem, 2.2vw, 1.9rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(200, 210, 215, 0.52);
            text-shadow: 0 1px 12px rgba(0,0,0,0.5);
            display: block;
            letter-spacing: 2px;
        }
        .scratch-text.hidden { opacity: 0; }

        @media (max-width: 768px) {
            .reveal-logo { width: 120px; height: 120px; }
            .scratch-hint { font-size: 0.9rem; letter-spacing: 2px; }
            .scratch-text .line1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Background photo -->
    <div class="bg-image"></div>

    <!-- Revealed content -->
    <div class="reveal-content">
        <img src="logo.png" alt="Logo" class="reveal-logo" id="revealLogo">
        <div class="headline" id="revealHeadline">
            <h2>
                <span>Erfolgsgeschichten</span>
                <span>beginnen hier.</span>
            </h2>
            <p class="reveal-subtitle">Your Professional Portfolio</p>
        </div>
        <a href="motivation.html" class="enter-btn" id="revealBtn">Enter Site</a>
    </div>

    <!-- Scratch hints -->
    <div class="scratch-hint scratch-hint-left"  id="hintLeft">Scratch<br>to Reveal</div>
    <div class="scratch-hint scratch-hint-right" id="hintRight">Scratch<br>to Reveal</div>

    <!-- "Warum nicht auch meine" -->
    <div class="scratch-text" id="scratchText">
        <span class="line1">Warum nicht auch meine</span>
    </div>

    <canvas id="scratch-canvas"></canvas>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx    = canvas.getContext('2d');
        const hintL  = document.getElementById('hintLeft');
        const hintR  = document.getElementById('hintRight');
        const scratchText  = document.getElementById('scratchText');
        const revealLogo   = document.getElementById('revealLogo');
        const revealHeadline = document.getElementById('revealHeadline');
        const revealBtn    = document.getElementById('revealBtn');

        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;

        // Draw Scratch.png scaled to cover canvas
        const scratchImg = new Image();
        scratchImg.onerror = () => {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        };
        scratchImg.onload = () => {
            const scale = Math.max(canvas.width / scratchImg.width, canvas.height / scratchImg.height);
            const sw = scratchImg.width  * scale;
            const sh = scratchImg.height * scale;
            const sx = (canvas.width  - sw) / 2;
            const sy = (canvas.height - sh) / 2;
            ctx.drawImage(scratchImg, sx, sy, sw, sh);
        };
        scratchImg.src = 'Scratch.png';

        let isScratching = false, revealed = false;
        let lastX = 0, lastY = 0;
        const BRUSH = 90;

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            return e.touches
                ? { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top }
                : { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        function startScratch(e) {
            isScratching = true;
            const p = getPos(e);
            lastX = p.x; lastY = p.y;
            doScratch(e);
            hintL.classList.add('hidden');
            hintR.classList.add('hidden');
        }

        function doScratch(e) {
            if (!isScratching) return;
            const { x, y } = getPos(e);

            // Clean erase — no colour, just reveal background photo
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = BRUSH * 2;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            const grad = ctx.createRadialGradient(x, y, 0, x, y, BRUSH);
            grad.addColorStop(0,   'rgba(0,0,0,1)');
            grad.addColorStop(0.7, 'rgba(0,0,0,0.85)');
            grad.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, BRUSH, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            lastX = x; lastY = y;

            // 25% threshold to trigger reveal
            const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let t = 0;
            for (let i = 3; i < d.length; i += 4) if (d[i] === 0) t++;
            if ((t / (d.length / 4)) * 100 > 10 && !revealed) doReveal();
        }

        function doReveal() {
            revealed = true;
            scratchText.classList.add('hidden');
            canvas.style.transition = 'opacity 1s ease';
            canvas.style.opacity = '0';
            setTimeout(() => canvas.style.display = 'none', 1000);
            setTimeout(() => {
                revealLogo.classList.add('show');
                revealHeadline.classList.add('show');
                revealBtn.classList.add('show');
            }, 300);
        }

        canvas.addEventListener('mousedown',  startScratch);
        canvas.addEventListener('mousemove',  doScratch);
        canvas.addEventListener('mouseup',    () => isScratching = false);
        canvas.addEventListener('mouseleave', () => isScratching = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); startScratch(e); }, { passive: false });
        canvas.addEventListener('touchmove',  e => { e.preventDefault(); doScratch(e); },   { passive: false });
        canvas.addEventListener('touchend',   () => isScratching = false);

        // Triple-click to skip
        let clicks = 0;
        canvas.addEventListener('click', () => {
            if (++clicks >= 3) doReveal();
            setTimeout(() => clicks = 0, 1000);
        });

        window.addEventListener('resize', () => {
            if (revealed) return;
            const saved = canvas.toDataURL();
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            const tmp = new Image();
            tmp.onload = () => ctx.drawImage(tmp, 0, 0);
            tmp.src = saved;
        });
    </script>
</body>
</html>
