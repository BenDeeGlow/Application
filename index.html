<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome &#x2013; Professional Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #001f2b;
        }

        /*
          LAYER STACK (bottom → top):
          1. body background = navy  → visible only after full reveal
          2. #canvas-yellow  z:1    → always-solid yellow, shows through scratched holes
          3. #canvas-image   z:2    → photo drawn here; scratching erases it → yellow shows
          4. .reveal-content z:5    → navy panel, fades in at 25% threshold
          5. .scratch-hint   z:8    → hint text on top
        */

        #canvas-yellow,
        #canvas-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #canvas-yellow { z-index: 1; pointer-events: none; }
        #canvas-image  { z-index: 2; cursor: crosshair; }

        /* ── Revealed content (pure navy, no photo) ── */
        .reveal-content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            background: #001f2b;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .reveal-content.show { opacity: 1; pointer-events: auto; }

        .reveal-logo {
            width: 160px; height: 160px;
            margin-bottom: 1.8rem;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 1s ease 0.3s, transform 1s cubic-bezier(0.16,1,0.3,1) 0.3s;
            object-fit: contain;
            /* No filter — logo uses its own navy+gold colours which match the page */
        }
        .reveal-content.show .reveal-logo { opacity: 1; transform: scale(1); }

        .reveal-welcome {
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 700;
            color: #fcd202;
            letter-spacing: -1px;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
            text-align: center;
        }
        .reveal-content.show .reveal-welcome { opacity: 1; transform: translateY(0); }

        .reveal-subtitle {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.35);
            margin-top: 0.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 1s ease 0.65s, transform 1s ease 0.65s;
        }
        .reveal-content.show .reveal-subtitle { opacity: 1; transform: translateY(0); }

        .enter-btn {
            margin-top: 2.5rem;
            padding: 1rem 2.8rem;
            background: transparent;
            color: #fcd202;
            border: 2px solid #fcd202;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            transform: translateY(16px);
            transition: background 0.3s, color 0.3s,
                        opacity 1s ease 0.8s, transform 1s ease 0.8s;
            pointer-events: none;
        }
        .reveal-content.show .enter-btn {
            opacity: 1; transform: translateY(0); pointer-events: auto;
        }
        .enter-btn:hover { background: #fcd202; color: #001f2b; }

        .warum-text {
            margin-top: 1.6rem;
            font-size: clamp(0.85rem, 1.6vw, 1.2rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(200, 210, 215, 0.42);
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1s ease 0.95s, transform 1s ease 0.95s;
            text-align: center;
        }
        .reveal-content.show .warum-text { opacity: 1; transform: translateY(0); }

        /* ── Scratch hints ── */
        .scratch-hint {
            position: fixed;
            z-index: 8;
            pointer-events: none;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            font-weight: 700;
            color: rgba(0, 30, 40, 0.75);
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
            transition: opacity 0.4s ease;
        }
        .scratch-hint-left {
            top: 28%; left: 22%;
            transform: translate(-50%,-50%) rotate(-20deg);
            animation: hintPulseL 2.4s ease-in-out infinite;
        }
        .scratch-hint-right {
            top: 28%; left: 78%;
            transform: translate(-50%,-50%) rotate(20deg);
            animation: hintPulseR 2.4s ease-in-out infinite 0.4s;
        }
        .scratch-hint.hidden { opacity: 0 !important; animation: none; }

        @keyframes hintPulseL {
            0%,100%{ opacity:.75; transform:translate(-50%,-50%) rotate(-20deg) scale(1); }
            50%    { opacity:1;   transform:translate(-50%,-50%) rotate(-20deg) scale(1.06); }
        }
        @keyframes hintPulseR {
            0%,100%{ opacity:.75; transform:translate(-50%,-50%) rotate(20deg) scale(1); }
            50%    { opacity:1;   transform:translate(-50%,-50%) rotate(20deg) scale(1.06); }
        }

        @media (max-width: 768px) {
            .reveal-logo { width: 110px; height: 110px; }
            .scratch-hint { font-size: 1rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <!-- Layer 1: solid yellow — ALWAYS opaque, shows through erased photo -->
    <canvas id="canvas-yellow"></canvas>

    <!-- Layer 2: photo — gets erased by scratching, revealing yellow below -->
    <canvas id="canvas-image"></canvas>

    <!-- Layer 3: navy reveal panel -->
    <div class="reveal-content" id="revealContent">
        <img src="logo.png" alt="Logo" class="reveal-logo">
        <span class="reveal-welcome">Welcome</span>
        <span class="reveal-subtitle">Professional Portfolio</span>
        <a href="motivation.html" class="enter-btn">Enter Site</a>
        <p class="warum-text">Warum nicht auch meine</p>
    </div>

    <!-- Hints -->
    <div class="scratch-hint scratch-hint-left"  id="hintLeft">Scratch<br>to Reveal</div>
    <div class="scratch-hint scratch-hint-right" id="hintRight">Scratch<br>to Reveal</div>

    <script>
        const cvY   = document.getElementById('canvas-yellow');
        const cvI   = document.getElementById('canvas-image');
        const ctxY  = cvY.getContext('2d');
        const ctxI  = cvI.getContext('2d');
        const reveal = document.getElementById('revealContent');
        const hintL  = document.getElementById('hintLeft');
        const hintR  = document.getElementById('hintRight');

        /* ── Size both canvases to viewport ── */
        function setSize() {
            const w = window.innerWidth, h = window.innerHeight;
            cvY.width  = cvI.width  = w;
            cvY.height = cvI.height = h;
        }
        setSize();

        /* ── Yellow canvas: solid #fcd202 fill ── */
        function fillYellow() {
            ctxY.fillStyle = '#fcd202';
            ctxY.fillRect(0, 0, cvY.width, cvY.height);
        }
        fillYellow();

        /* ── Image canvas: draw photo shifted right by 10% ── */
        const photo = new Image();
        photo.onerror = () => {
            /* Fallback: opaque dark fill so canvas blocks yellow */
            ctxI.fillStyle = '#002840';
            ctxI.fillRect(0, 0, cvI.width, cvI.height);
        };
        photo.onload = drawPhoto;
        photo.src = 'Scratch.png';

        function drawPhoto() {
            const cw = cvI.width, ch = cvI.height;
            const iw = photo.width,  ih = photo.height;
            const scale = Math.max(cw / iw, ch / ih);
            const sw = iw * scale, sh = ih * scale;
            /* Shift right: offset x by +10% of canvas width (moves image right, crops left) */
            const ox = cw * 0.10;
            /* Vertical: 25% from top */
            const oy = (ch - sh) * 0.25;
            ctxI.drawImage(photo, ox, oy, sw, sh);
        }

        /* ── Scratch logic ── */
        let scratching = false, done = false;
        let lx = 0, ly = 0;
        const R = 85; /* brush radius */

        function pos(e) {
            const r = cvI.getBoundingClientRect();
            return e.touches
                ? { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top }
                : { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        function begin(e) {
            scratching = true;
            const p = pos(e);
            lx = p.x; ly = p.y;
            hintL.classList.add('hidden');
            hintR.classList.add('hidden');
            erase(e);
        }

        function erase(e) {
            if (!scratching) return;
            const { x, y } = pos(e);

            /* destination-out removes pixels from the image canvas,
               making those pixels fully transparent → yellow canvas shines through */
            ctxI.globalCompositeOperation = 'destination-out';
            ctxI.lineCap  = 'round';
            ctxI.lineJoin = 'round';
            ctxI.lineWidth = R * 2;
            ctxI.beginPath();
            ctxI.moveTo(lx, ly);
            ctxI.lineTo(x, y);
            ctxI.stroke();
            ctxI.beginPath();
            ctxI.arc(x, y, R, 0, Math.PI * 2);
            ctxI.fill();
            ctxI.globalCompositeOperation = 'source-over';

            lx = x; ly = y;

            /* Check 25% threshold (sample every 32nd alpha byte for speed) */
            if (!done) {
                const d = ctxI.getImageData(0, 0, cvI.width, cvI.height).data;
                let t = 0, total = 0;
                for (let i = 3; i < d.length; i += 32) {
                    if (d[i] < 128) t++;
                    total++;
                }
                if (t / total > 0.25) revealPage();
            }
        }

        function revealPage() {
            done = true;
            cvI.style.transition = cvY.style.transition = 'opacity 1.1s ease';
            cvI.style.opacity    = cvY.style.opacity    = '0';
            setTimeout(() => { cvI.style.display = cvY.style.display = 'none'; }, 1200);
            setTimeout(() => reveal.classList.add('show'), 100);
        }

        cvI.addEventListener('mousedown',  begin);
        cvI.addEventListener('mousemove',  erase);
        cvI.addEventListener('mouseup',    () => scratching = false);
        cvI.addEventListener('mouseleave', () => scratching = false);
        cvI.addEventListener('touchstart', e => { e.preventDefault(); begin(e); }, { passive: false });
        cvI.addEventListener('touchmove',  e => { e.preventDefault(); erase(e); }, { passive: false });
        cvI.addEventListener('touchend',   () => scratching = false);

        /* Triple-click skip */
        let clicks = 0;
        cvI.addEventListener('click', () => {
            if (++clicks >= 3) revealPage();
            setTimeout(() => clicks = 0, 1000);
        });

        window.addEventListener('resize', () => {
            if (done) return;
            setSize();
            fillYellow();
            drawPhoto();
        });
    </script>
</body>
</html>
