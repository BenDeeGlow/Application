<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome – Professional Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            overflow: hidden;
            height: 100vh;
        }

        /* ── Background photo — shifted right ~5% to compensate left-heavy composition ── */
        .bg-image {
            position: fixed;
            inset: 0;
            background-image: url('Scratch.png');
            background-size: cover;
            /* shift right to better centre the "Erfolgsgeschichten" text in the image */
            background-position: 55% top;
            z-index: 0;
        }

        /* Gradient overlay to mask baked-in text in the photo */
        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    to bottom,
                    transparent 30%,
                    rgba(0, 20, 35, 0.72) 42%,
                    rgba(0, 20, 35, 0.80) 55%,
                    rgba(0, 20, 35, 0.72) 68%,
                    transparent 80%
                );
        }

        /* ── Revealed content (logo + headline + button + warum) ── */
        .reveal-content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
        }

        .reveal-logo {
            width: 175px;
            height: 175px;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: scale(0.85);
            transition: all 0.9s ease;
            object-fit: contain;
            filter: brightness(1.6) saturate(0.7) drop-shadow(0 1px 4px rgba(0,0,0,0.3));
        }
        .reveal-logo.show { opacity: 1; transform: scale(1); }

        .headline {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.9s ease 0.2s;
            pointer-events: none;
        }
        .headline.show { opacity: 1; transform: translateY(0); }

        .headline h2 {
            font-size: clamp(1.8rem, 3.2vw, 3rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 20px rgba(0,0,0,0.6), 0 1px 4px rgba(0,0,0,0.5);
            margin-bottom: 0.3rem;
        }
        .headline h2 span { display: block; }

        .reveal-subtitle {
            font-size: clamp(0.9rem, 1.4vw, 1.2rem);
            color: rgba(255,255,255,0.75);
            margin-top: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-shadow: 0 1px 8px rgba(0,0,0,0.5);
        }

        .enter-btn {
            margin-top: 2.5rem;
            padding: 1rem 2.8rem;
            background: #002e3d;
            color: #fcd202;
            border: 2px solid #fcd202;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            transition: background 0.3s, color 0.3s, transform 0.3s,
                        opacity 0.9s ease 0.5s, transform 0.9s ease 0.5s;
            pointer-events: none;
        }
        .enter-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .enter-btn:hover { background: #e8c800; color: #002e3d; transform: scale(1.04); }

        /* "Warum nicht auch meine" — shown BELOW the enter button after reveal */
        .warum-text {
            margin-top: 1.8rem;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(1rem, 1.8vw, 1.5rem);
            font-weight: 300;
            font-style: italic;
            /* same subtle grey as V1 */
            color: rgba(200, 210, 215, 0.55);
            letter-spacing: 2px;
            text-shadow: 0 1px 12px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.9s ease 0.75s, transform 0.9s ease 0.75s;
            pointer-events: none;
        }
        .warum-text.show { opacity: 1; transform: translateY(0); }

        /* ── Scratch canvas ── */
        #scratch-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 10;
        }

        /* ── Yellow scratch trail overlay ── */
        #glow-canvas {
            position: fixed;
            inset: 0;
            z-index: 11;
            pointer-events: none;
        }

        /* ── "Scratch to Reveal" hints — bigger, ~20° tilt ── */
        .scratch-hint {
            position: fixed;
            z-index: 12;
            pointer-events: none;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(1.4rem, 3vw, 2.4rem);   /* enlarged */
            font-weight: 700;
            color: rgba(8, 8, 8, 0.82);
            text-shadow: 0 1px 6px rgba(255,255,255,0.1);
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
            transition: opacity 0.5s ease;
        }

        .scratch-hint-left {
            top: 25%;
            left: 18%;
            transform: translate(-50%, -50%) rotate(-20deg);
            animation: hintPulseLeft 2.4s ease-in-out infinite;
        }
        .scratch-hint-right {
            top: 25%;
            left: 72%;
            transform: translate(-50%, -50%) rotate(20deg);
            animation: hintPulseRight 2.4s ease-in-out infinite 0.35s;
        }
        .scratch-hint.hidden { opacity: 0 !important; animation: none; }

        @keyframes hintPulseLeft {
            0%, 100% { opacity: 0.82; transform: translate(-50%,-50%) rotate(-20deg) scale(1); }
            50%       { opacity: 1;   transform: translate(-50%,-50%) rotate(-20deg) scale(1.07); }
        }
        @keyframes hintPulseRight {
            0%, 100% { opacity: 0.82; transform: translate(-50%,-50%) rotate(20deg) scale(1); }
            50%       { opacity: 1;   transform: translate(-50%,-50%) rotate(20deg) scale(1.07); }
        }

        @media (max-width: 768px) {
            .reveal-logo { width: 120px; height: 120px; }
            .scratch-hint { font-size: 1.1rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <!-- Background photo (Scratch.png as bg, shifted right to centre text) -->
    <div class="bg-image"></div>

    <!-- Revealed content -->
    <div class="reveal-content">
        <img src="logo.png" alt="Logo" class="reveal-logo" id="revealLogo">
        <div class="headline" id="revealHeadline">
            <h2>
                <span>Erfolgsgeschichten</span>
                <span>beginnen hier.</span>
            </h2>
            <p class="reveal-subtitle">Your Professional Portfolio</p>
        </div>
        <a href="motivation.html" class="enter-btn" id="revealBtn">Enter Site</a>
        <!-- V1 "Warum" — subtle grey, below button -->
        <p class="warum-text" id="warumText">Warum nicht auch meine</p>
    </div>

    <!-- Scratch hints: bigger, 20° tilt, pulsating -->
    <div class="scratch-hint scratch-hint-left"  id="hintLeft">Scratch<br>to Reveal</div>
    <div class="scratch-hint scratch-hint-right" id="hintRight">Scratch<br>to Reveal</div>

    <!-- Yellow glow overlay for scratch trail -->
    <canvas id="glow-canvas"></canvas>
    <canvas id="scratch-canvas"></canvas>

    <script>
        const canvas    = document.getElementById('scratch-canvas');
        const ctx       = canvas.getContext('2d');
        const glowCv    = document.getElementById('glow-canvas');
        const gCtx      = glowCv.getContext('2d');
        const hintL     = document.getElementById('hintLeft');
        const hintR     = document.getElementById('hintRight');
        const revealLogo     = document.getElementById('revealLogo');
        const revealHeadline = document.getElementById('revealHeadline');
        const revealBtn      = document.getElementById('revealBtn');
        const warumText      = document.getElementById('warumText');

        function resize() {
            canvas.width  = glowCv.width  = window.innerWidth;
            canvas.height = glowCv.height = window.innerHeight;
        }
        resize();

        // Draw Scratch.png scaled to cover canvas
        const scratchImg = new Image();
        scratchImg.onerror = () => {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        };
        scratchImg.onload = drawScratch;
        scratchImg.src = 'Scratch.png';

        function drawScratch() {
            const scale = Math.max(canvas.width / scratchImg.width, canvas.height / scratchImg.height);
            const sw = scratchImg.width  * scale;
            const sh = scratchImg.height * scale;
            // Shift canvas draw right by 5% to match bg-image offset
            const sx = (canvas.width  - sw) / 2 + canvas.width * 0.05;
            const sy = (canvas.height - sh) / 2;
            ctx.drawImage(scratchImg, sx, sy, sw, sh);
        }

        let isScratching = false, revealed = false;
        let lastX = 0, lastY = 0;
        const BRUSH = 90;
        let glowFade;

        const getPos = e => {
            const r = canvas.getBoundingClientRect();
            return e.touches
                ? { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top }
                : { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        function startScratch(e) {
            isScratching = true;
            const p = getPos(e);
            lastX = p.x; lastY = p.y;
            doScratch(e);
            hintL.classList.add('hidden');
            hintR.classList.add('hidden');
        }

        function doScratch(e) {
            if (!isScratching) return;
            const { x, y } = getPos(e);

            // Erase scratch layer
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = BRUSH * 2;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            const grad = ctx.createRadialGradient(x, y, 0, x, y, BRUSH);
            grad.addColorStop(0,   'rgba(0,0,0,1)');
            grad.addColorStop(0.7, 'rgba(0,0,0,0.85)');
            grad.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, BRUSH, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // Yellow glow trail on top
            const glow = gCtx.createRadialGradient(x, y, 0, x, y, BRUSH * 0.75);
            glow.addColorStop(0,    'rgba(252,210,2,0.55)');
            glow.addColorStop(0.5,  'rgba(252,210,2,0.18)');
            glow.addColorStop(1,    'rgba(252,210,2,0)');
            gCtx.fillStyle = glow;
            gCtx.beginPath();
            gCtx.arc(x, y, BRUSH * 0.75, 0, Math.PI * 2);
            gCtx.fill();

            clearTimeout(glowFade);
            glowFade = setTimeout(() => gCtx.clearRect(0, 0, glowCv.width, glowCv.height), 150);

            lastX = x; lastY = y;

            // 25% threshold
            const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let t = 0;
            for (let i = 3; i < d.length; i += 4) if (d[i] === 0) t++;
            if ((t / (d.length / 4)) * 100 > 25 && !revealed) doReveal();
        }

        function doReveal() {
            revealed = true;
            canvas.style.transition = 'opacity 1s ease';
            glowCv.style.transition = 'opacity 0.5s ease';
            canvas.style.opacity = glowCv.style.opacity = '0';
            setTimeout(() => {
                canvas.style.display = glowCv.style.display = 'none';
            }, 1100);
            setTimeout(() => {
                revealLogo.classList.add('show');
                revealHeadline.classList.add('show');
                revealBtn.classList.add('show');
                warumText.classList.add('show');
            }, 300);
        }

        canvas.addEventListener('mousedown',  startScratch);
        canvas.addEventListener('mousemove',  doScratch);
        canvas.addEventListener('mouseup',    () => isScratching = false);
        canvas.addEventListener('mouseleave', () => isScratching = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); startScratch(e); }, { passive: false });
        canvas.addEventListener('touchmove',  e => { e.preventDefault(); doScratch(e); },   { passive: false });
        canvas.addEventListener('touchend',   () => isScratching = false);

        let clicks = 0;
        canvas.addEventListener('click', () => {
            if (++clicks >= 3) doReveal();
            setTimeout(() => clicks = 0, 1000);
        });

        window.addEventListener('resize', () => {
            if (revealed) return;
            const saved = canvas.toDataURL();
            resize();
            const tmp = new Image();
            tmp.onload = () => ctx.drawImage(tmp, 0, 0);
            tmp.src = saved;
        });
    </script>
</body>
</html>
