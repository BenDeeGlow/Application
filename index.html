<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome &#x2013; Professional Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
            /* Pure navy — what shows after reveal */
            background: #001f2b;
        }

        /* ── Background photo ─────────────────────────────────
           left top with vertical shift: background-position y=25%
           moves the image UP so the embedded text sits centre-screen  */
        .bg-image {
            position: fixed;
            inset: 0;
            background-image: url('Scratch.png');
            background-size: cover;
            background-position: left 25%;
            z-index: 0;
            transition: opacity 1.2s ease;
        }
        /* Fade out the background photo when reveal happens */
        .bg-image.hidden { opacity: 0; pointer-events: none; }

        /* ── Top-right placeholder text ── */
        .top-right-text {
            position: fixed;
            top: 2rem;
            right: 2.5rem;
            z-index: 12;
            text-align: right;
            pointer-events: none;
            max-width: 260px;
        }
        .top-right-text p {
            font-size: 0.82rem;
            font-weight: 400;
            font-style: italic;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.6);
        }

        /* ── Revealed content — pure navy, no photo ── */
        .reveal-content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            /* navy background so no photo shows through */
            background: #001f2b;
            opacity: 0;
            transition: opacity 0.6s ease 0.4s;
        }
        .reveal-content.show {
            opacity: 1;
            pointer-events: auto;
        }

        .reveal-logo {
            width: 175px; height: 175px;
            margin-bottom: 1.8rem;
            opacity: 0;
            transform: scale(0.85);
            transition: all 1s cubic-bezier(0.16,1,0.3,1) 0.5s;
            object-fit: contain;
            filter: brightness(1.6) saturate(0.7) drop-shadow(0 2px 12px rgba(0,0,0,0.4));
        }
        .reveal-content.show .reveal-logo { opacity: 1; transform: scale(1); }

        .reveal-welcome {
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 700;
            color: #fcd202;
            letter-spacing: -1px;
            opacity: 0;
            transform: translateY(24px);
            transition: all 1s ease 0.65s;
            text-align: center;
        }
        .reveal-content.show .reveal-welcome { opacity: 1; transform: translateY(0); }

        .reveal-subtitle {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(16px);
            transition: all 1s ease 0.8s;
        }
        .reveal-content.show .reveal-subtitle { opacity: 1; transform: translateY(0); }

        .enter-btn {
            margin-top: 2.5rem;
            padding: 1rem 2.8rem;
            background: #002e3d;
            color: #fcd202;
            border: 2px solid #fcd202;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            transform: translateY(16px);
            transition: background 0.3s, color 0.3s,
                        opacity 1s ease 0.95s, transform 1s ease 0.95s;
            pointer-events: none;
        }
        .reveal-content.show .enter-btn {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .enter-btn:hover { background: #e8c800; color: #002e3d; }

        .warum-text {
            margin-top: 1.6rem;
            font-size: clamp(0.95rem, 1.8vw, 1.45rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(200, 210, 215, 0.52);
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1s ease 1.1s, transform 1s ease 1.1s;
            text-align: center;
        }
        .reveal-content.show .warum-text { opacity: 1; transform: translateY(0); }

        /* ── Scratch canvas ── */
        #scratch-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 10;
        }

        /* ── Scratch hints ── */
        .scratch-hint {
            position: fixed;
            z-index: 12;
            pointer-events: none;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            font-weight: 700;
            color: rgba(8, 8, 8, 0.82);
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
            transition: opacity 0.5s ease;
        }
        .scratch-hint-left {
            top: 25%; left: 18%;
            transform: translate(-50%,-50%) rotate(-20deg);
            animation: hintPulseL 2.4s ease-in-out infinite;
        }
        .scratch-hint-right {
            top: 25%; left: 72%;
            transform: translate(-50%,-50%) rotate(20deg);
            animation: hintPulseR 2.4s ease-in-out infinite 0.35s;
        }
        .scratch-hint.hidden { opacity: 0 !important; animation: none; }

        @keyframes hintPulseL {
            0%,100%{ opacity:.82; transform:translate(-50%,-50%) rotate(-20deg) scale(1); }
            50%    { opacity:1;   transform:translate(-50%,-50%) rotate(-20deg) scale(1.07); }
        }
        @keyframes hintPulseR {
            0%,100%{ opacity:.82; transform:translate(-50%,-50%) rotate(20deg) scale(1); }
            50%    { opacity:1;   transform:translate(-50%,-50%) rotate(20deg) scale(1.07); }
        }

        @media (max-width: 768px) {
            .reveal-logo { width: 110px; height: 110px; }
            .scratch-hint { font-size: 1rem; letter-spacing: 2px; }
            .top-right-text { display: none; }
        }
    </style>
</head>
<body>

    <!-- Background photo — hidden when reveal triggers -->
    <div class="bg-image" id="bgImage"></div>

    <!-- Top-right placeholder -->
    <div class="top-right-text">
        <p>[ Your text here — a short tagline, quote, or note to the reviewer ]</p>
    </div>

    <!-- Reveal: pure navy, no photo -->
    <div class="reveal-content" id="revealContent">
        <img src="logo.png" alt="Logo" class="reveal-logo">
        <span class="reveal-welcome">Welcome</span>
        <span class="reveal-subtitle">Professional Portfolio</span>
        <a href="motivation.html" class="enter-btn">Enter Site</a>
        <p class="warum-text">Warum nicht auch meine</p>
    </div>

    <!-- Scratch hints -->
    <div class="scratch-hint scratch-hint-left"  id="hintLeft">Scratch<br>to Reveal</div>
    <div class="scratch-hint scratch-hint-right" id="hintRight">Scratch<br>to Reveal</div>

    <canvas id="scratch-canvas"></canvas>

    <script>
        const canvas  = document.getElementById('scratch-canvas');
        const ctx     = canvas.getContext('2d');
        const bgImage = document.getElementById('bgImage');
        const revealContent = document.getElementById('revealContent');
        const hintL   = document.getElementById('hintLeft');
        const hintR   = document.getElementById('hintRight');

        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;

        /* Draw Scratch.png — cover, left-aligned with same y-shift as bg-image (25%) */
        const scratchImg = new Image();
        scratchImg.onerror = () => {
            ctx.fillStyle = '#1a2530';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        };
        scratchImg.onload = drawCover;
        scratchImg.src = 'Scratch.png';

        function drawCover() {
            const cw = canvas.width, ch = canvas.height;
            const iw = scratchImg.width, ih = scratchImg.height;
            const scale = Math.max(cw / iw, ch / ih);
            const sw = iw * scale, sh = ih * scale;
            /* x: left-aligned at 0
               y: shift up by 25% — moves image up so embedded text centres on screen */
            const sy = -(sh - ch) * 0.25;
            ctx.drawImage(scratchImg, 0, sy, sw, sh);
        }

        let isScratching = false, revealed = false;
        let lastX = 0, lastY = 0;
        const BRUSH = 90;

        const getPos = e => {
            const r = canvas.getBoundingClientRect();
            return e.touches
                ? { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top }
                : { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        function startScratch(e) {
            isScratching = true;
            const p = getPos(e);
            lastX = p.x; lastY = p.y;
            doScratch(e);
            hintL.classList.add('hidden');
            hintR.classList.add('hidden');
        }

        function doScratch(e) {
            if (!isScratching) return;
            const { x, y } = getPos(e);

            /* Step 1 — erase the image layer */
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineCap  = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = BRUSH * 2;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            /* Hard-edge circle erase */
            ctx.beginPath();
            ctx.arc(x, y, BRUSH, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            /* Step 2 — FULL solid yellow circle (no gradient, no transparency) */
            ctx.fillStyle = '#fcd202';
            ctx.beginPath();
            ctx.arc(x, y, BRUSH * 0.7, 0, Math.PI * 2);
            ctx.fill();

            lastX = x; lastY = y;

            /* 25% scratched → reveal */
            const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let t = 0;
            for (let i = 3; i < d.length; i += 4) if (d[i] === 0) t++;
            if ((t / (d.length / 4)) * 100 > 25 && !revealed) doReveal();
        }

        function doReveal() {
            revealed = true;
            /* Fade out canvas and background photo together */
            canvas.style.transition  = 'opacity 1.2s ease';
            canvas.style.opacity     = '0';
            bgImage.classList.add('hidden');   /* fades out the photo — pure navy shows */
            setTimeout(() => canvas.style.display = 'none', 1300);
            /* Show reveal panel */
            setTimeout(() => revealContent.classList.add('show'), 200);
        }

        canvas.addEventListener('mousedown',  startScratch);
        canvas.addEventListener('mousemove',  doScratch);
        canvas.addEventListener('mouseup',    () => isScratching = false);
        canvas.addEventListener('mouseleave', () => isScratching = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); startScratch(e); }, { passive: false });
        canvas.addEventListener('touchmove',  e => { e.preventDefault(); doScratch(e); },   { passive: false });
        canvas.addEventListener('touchend',   () => isScratching = false);

        let clicks = 0;
        canvas.addEventListener('click', () => {
            if (++clicks >= 3) doReveal();
            setTimeout(() => clicks = 0, 1000);
        });

        window.addEventListener('resize', () => {
            if (revealed) return;
            const saved = canvas.toDataURL();
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            const tmp = new Image();
            tmp.onload = () => ctx.drawImage(tmp, 0, 0);
            tmp.src = saved;
        });
    </script>
</body>
</html>
