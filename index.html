<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bennett Bauermeister</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #001f2b;
        }

        #canvas-yellow,
        #canvas-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #canvas-yellow { z-index: 1; pointer-events: none; }
        #canvas-image  { z-index: 2; cursor: crosshair; }

        .reveal-content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            background: #001f2b;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .reveal-content.show { opacity: 1; pointer-events: auto; }

        .reveal-logo {
            width: 160px; height: 160px;
            margin-bottom: 1.8rem;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 1s ease 0.3s, transform 1s cubic-bezier(0.16,1,0.3,1) 0.3s;
            object-fit: contain;
        }
        .reveal-content.show .reveal-logo { opacity: 1; transform: scale(1); }

        .reveal-welcome {
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 700;
            color: #fcd202;
            letter-spacing: -1px;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
            text-align: center;
        }
        .reveal-content.show .reveal-welcome { opacity: 1; transform: translateY(0); }

        .reveal-subtitle {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.35);
            margin-top: 0.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 1s ease 0.65s, transform 1s ease 0.65s;
        }
        .reveal-content.show .reveal-subtitle { opacity: 1; transform: translateY(0); }

        .enter-btn {
            margin-top: 2.5rem;
            padding: 1rem 2.8rem;
            background: transparent;
            color: #fcd202;
            border: 2px solid #fcd202;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            transform: translateY(16px);
            transition: background 0.3s, color 0.3s,
                        opacity 1s ease 0.8s, transform 1s ease 0.8s;
            pointer-events: none;
        }
        .reveal-content.show .enter-btn { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .enter-btn:hover { background: #fcd202; color: #001f2b; }

        /* Bigger, greyer warum text */
        .warum-text {
            margin-top: 2rem;
            font-size: clamp(1.1rem, 2.2vw, 1.7rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(180, 190, 200, 0.35);
            letter-spacing: 3px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1s ease 0.95s, transform 1s ease 0.95s;
            text-align: center;
        }
        .reveal-content.show .warum-text { opacity: 1; transform: translateY(0); }

        /* Top-left tagline */
        .top-left-tag {
            position: fixed;
            top: 1.8rem;
            left: 1.8rem;
            z-index: 15;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }
        .top-left-tag img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            opacity: 0.85;
        }
        .top-left-tag span {
            font-size: 0.78rem;
            font-weight: 400;
            font-style: italic;
            color: rgba(255,255,255,0.45);
            letter-spacing: 1px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
        }

        .scratch-hint {
            position: fixed;
            z-index: 8;
            pointer-events: none;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            font-weight: 700;
            color: rgba(0, 30, 40, 0.75);
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
            transition: opacity 0.4s ease;
        }
        .scratch-hint-left {
            top: 28%; left: 22%;
            transform: translate(-50%,-50%) rotate(-20deg);
            animation: hpL 2.4s ease-in-out infinite;
        }
        .scratch-hint-right {
            top: 28%; left: 78%;
            transform: translate(-50%,-50%) rotate(20deg);
            animation: hpR 2.4s ease-in-out infinite 0.4s;
        }
        .scratch-hint.hidden { opacity: 0 !important; animation: none; }

        @keyframes hpL {
            0%,100%{ opacity:.75; transform:translate(-50%,-50%) rotate(-20deg) scale(1); }
            50%    { opacity:1;   transform:translate(-50%,-50%) rotate(-20deg) scale(1.06); }
        }
        @keyframes hpR {
            0%,100%{ opacity:.75; transform:translate(-50%,-50%) rotate(20deg) scale(1); }
            50%    { opacity:1;   transform:translate(-50%,-50%) rotate(20deg) scale(1.06); }
        }

        @media (max-width: 768px) {
            .reveal-logo { width: 110px; height: 110px; }
            .scratch-hint { font-size: 1rem; letter-spacing: 2px; }
            .top-left-tag span { display: none; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-yellow"></canvas>
    <canvas id="canvas-image"></canvas>

    <div class="reveal-content" id="revealContent">
        <img src="logo.png" alt="Logo" class="reveal-logo">
        <span class="reveal-welcome">Bennett Bauermeister</span>
        <span class="reveal-subtitle">Dual Student</span>
        <a href="motivation.html" class="enter-btn">Enter Site</a>
        <p class="warum-text">Warum nicht auch meine</p>
    </div>

    <div class="scratch-hint scratch-hint-left"  id="hintLeft">Scratch<br>to Reveal</div>
    <div class="scratch-hint scratch-hint-right" id="hintRight">Scratch<br>to Reveal</div>

    <script>
        var cvY = document.getElementById('canvas-yellow');
        var cvI = document.getElementById('canvas-image');
        var ctxY = cvY.getContext('2d');
        var ctxI = cvI.getContext('2d');
        var reveal = document.getElementById('revealContent');
        var hintL = document.getElementById('hintLeft');
        var hintR = document.getElementById('hintRight');

        function setSize() {
            var w = window.innerWidth, h = window.innerHeight;
            cvY.width = cvI.width = w;
            cvY.height = cvI.height = h;
        }
        setSize();

        function fillYellow() {
            ctxY.fillStyle = '#fcd202';
            ctxY.fillRect(0, 0, cvY.width, cvY.height);
        }
        fillYellow();

        var photo = new Image();
        photo.onerror = function() {
            ctxI.fillStyle = '#002840';
            ctxI.fillRect(0, 0, cvI.width, cvI.height);
        };
        photo.onload = drawPhoto;
        photo.src = 'Scratch.png';

        function drawPhoto() {
            var cw = cvI.width, ch = cvI.height;
            var iw = photo.width, ih = photo.height;
            var scale = Math.max(cw / iw, ch / ih);
            var sw = iw * scale, sh = ih * scale;
            var ox = (cw - sw) / 2;
            var oy = (ch - sh) / 2;
            ctxI.drawImage(photo, ox, oy, sw, sh);
        }

        var scratching = false, done = false;
        var lx = 0, ly = 0;
        var R = 85;

        function getPos(e) {
            var r = cvI.getBoundingClientRect();
            if (e.touches) return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        function begin(e) {
            scratching = true;
            var p = getPos(e);
            lx = p.x; ly = p.y;
            hintL.classList.add('hidden');
            hintR.classList.add('hidden');
            erase(e);
        }

        function erase(e) {
            if (!scratching) return;
            var p = getPos(e);
            var x = p.x, y = p.y;

            ctxI.globalCompositeOperation = 'destination-out';
            ctxI.lineCap = 'round';
            ctxI.lineJoin = 'round';
            ctxI.lineWidth = R * 2;
            ctxI.beginPath();
            ctxI.moveTo(lx, ly);
            ctxI.lineTo(x, y);
            ctxI.stroke();
            ctxI.beginPath();
            ctxI.arc(x, y, R, 0, Math.PI * 2);
            ctxI.fill();
            ctxI.globalCompositeOperation = 'source-over';

            lx = x; ly = y;

            if (!done) {
                var d = ctxI.getImageData(0, 0, cvI.width, cvI.height).data;
                var t = 0, total = 0;
                for (var i = 3; i < d.length; i += 32) {
                    if (d[i] < 128) t++;
                    total++;
                }
                if (t / total > 0.25) revealPage();
            }
        }

        function revealPage() {
            done = true;
            cvI.style.transition = cvY.style.transition = 'opacity 1.1s ease';
            cvI.style.opacity = cvY.style.opacity = '0';
            setTimeout(function() { cvI.style.display = cvY.style.display = 'none'; }, 1200);
            setTimeout(function() { reveal.classList.add('show'); }, 150);
        }

        cvI.addEventListener('mousedown', begin);
        cvI.addEventListener('mousemove', erase);
        cvI.addEventListener('mouseup', function() { scratching = false; });
        cvI.addEventListener('mouseleave', function() { scratching = false; });
        cvI.addEventListener('touchstart', function(e) { e.preventDefault(); begin(e); }, { passive: false });
        cvI.addEventListener('touchmove', function(e) { e.preventDefault(); erase(e); }, { passive: false });
        cvI.addEventListener('touchend', function() { scratching = false; });

        var clicks = 0;
        cvI.addEventListener('click', function() {
            if (++clicks >= 3) revealPage();
            setTimeout(function() { clicks = 0; }, 1000);
        });

        window.addEventListener('resize', function() {
            if (done) return;
            setSize();
            fillYellow();
            drawPhoto();
        });
    </script>
</body>
</html>
