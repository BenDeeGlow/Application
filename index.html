<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome – Professional Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
            /* Navy blue — shown after scratch completes */
            background: linear-gradient(145deg, #001f2b 0%, #002e3d 60%, #003a4d 100%);
        }

        /* ── Background photo: fullscreen, left-aligned ── */
        .bg-image {
            position: fixed;
            inset: 0;
            background-image: url('Scratch.png');
            background-size: cover;
            background-position: left top;
            z-index: 0;
        }

        /* Subtle gradient overlay — does NOT mask text, just adds depth */
        .bg-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.08) 0%,
                transparent 40%,
                rgba(0,0,0,0.15) 100%
            );
        }

        /* ── Revealed content (navy bg, shown after scratch) ── */
        .reveal-content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
        }

        .reveal-logo {
            width: 175px;
            height: 175px;
            margin-bottom: 1.8rem;
            opacity: 0;
            transform: scale(0.85);
            transition: all 1s cubic-bezier(0.16,1,0.3,1);
            object-fit: contain;
            filter: brightness(1.6) saturate(0.7) drop-shadow(0 2px 12px rgba(0,0,0,0.4));
        }
        .reveal-logo.show { opacity: 1; transform: scale(1); }

        .reveal-welcome {
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 700;
            color: #fcd202;
            letter-spacing: -1px;
            opacity: 0;
            transform: translateY(28px);
            transition: all 1s ease 0.2s;
            text-align: center;
        }
        .reveal-welcome.show { opacity: 1; transform: translateY(0); }

        .reveal-subtitle {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.6rem;
            margin-bottom: 0;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(18px);
            transition: all 1s ease 0.35s;
        }
        .reveal-subtitle.show { opacity: 1; transform: translateY(0); }

        .enter-btn {
            margin-top: 2.5rem;
            padding: 1rem 2.8rem;
            background: #002e3d;
            color: #fcd202;
            border: 2px solid #fcd202;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            display: inline-block;
            opacity: 0;
            transform: translateY(18px);
            transition: background 0.3s, color 0.3s,
                        opacity 1s ease 0.55s, transform 1s ease 0.55s;
            pointer-events: none;
        }
        .enter-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .enter-btn:hover { background: #e8c800; color: #002e3d; }

        /* "Warum nicht auch meine" — subtle grey, below button, same as V1 */
        .warum-text {
            margin-top: 1.6rem;
            font-size: clamp(0.95rem, 1.8vw, 1.45rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(200, 210, 215, 0.52);
            letter-spacing: 2px;
            text-shadow: 0 1px 10px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 1s ease 0.75s, transform 1s ease 0.75s;
            pointer-events: none;
            text-align: center;
        }
        .warum-text.show { opacity: 1; transform: translateY(0); }

        /* ── Scratch canvas ── */
        #scratch-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 10;
        }

        /* ── "Scratch to Reveal" hints ── */
        .scratch-hint {
            position: fixed;
            z-index: 12;
            pointer-events: none;
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            font-weight: 700;
            color: rgba(8, 8, 8, 0.82);
            text-shadow: 0 1px 6px rgba(255,255,255,0.1);
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
            transition: opacity 0.5s ease;
        }
        .scratch-hint-left {
            top: 25%; left: 18%;
            transform: translate(-50%,-50%) rotate(-20deg);
            animation: hintPulseLeft 2.4s ease-in-out infinite;
        }
        .scratch-hint-right {
            top: 25%; left: 72%;
            transform: translate(-50%,-50%) rotate(20deg);
            animation: hintPulseRight 2.4s ease-in-out infinite 0.35s;
        }
        .scratch-hint.hidden { opacity: 0 !important; animation: none; }

        @keyframes hintPulseLeft {
            0%,100% { opacity:.82; transform:translate(-50%,-50%) rotate(-20deg) scale(1); }
            50%      { opacity:1;   transform:translate(-50%,-50%) rotate(-20deg) scale(1.07); }
        }
        @keyframes hintPulseRight {
            0%,100% { opacity:.82; transform:translate(-50%,-50%) rotate(20deg) scale(1); }
            50%      { opacity:1;   transform:translate(-50%,-50%) rotate(20deg) scale(1.07); }
        }

        @media (max-width: 768px) {
            .reveal-logo  { width: 110px; height: 110px; }
            .scratch-hint { font-size: 1rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <!-- Fullscreen background photo, left-aligned -->
    <div class="bg-image"></div>

    <!-- Revealed: navy bg + logo + Welcome + warum (NO Erfolgsgeschichten) -->
    <div class="reveal-content">
        <img src="logo.png" alt="Logo" class="reveal-logo"    id="rvLogo">
        <span class="reveal-welcome"                           id="rvWelcome">Welcome</span>
        <span class="reveal-subtitle"                          id="rvSub">Professional Portfolio</span>
        <a href="motivation.html" class="enter-btn"            id="rvBtn">Enter Site</a>
        <p class="warum-text"                                  id="rvWarum">Warum nicht auch meine</p>
    </div>

    <!-- Scratch hints -->
    <div class="scratch-hint scratch-hint-left"  id="hintLeft">Scratch<br>to Reveal</div>
    <div class="scratch-hint scratch-hint-right" id="hintRight">Scratch<br>to Reveal</div>

    <canvas id="scratch-canvas"></canvas>

    <script>
        const canvas  = document.getElementById('scratch-canvas');
        const ctx     = canvas.getContext('2d');
        const hintL   = document.getElementById('hintLeft');
        const hintR   = document.getElementById('hintRight');
        const reveals = ['rvLogo','rvWelcome','rvSub','rvBtn','rvWarum'].map(id => document.getElementById(id));

        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;

        /* Draw Scratch.png — fullscreen cover, left-aligned (same as bg-image) */
        const scratchImg = new Image();
        scratchImg.onerror = () => {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        };
        scratchImg.onload = drawCover;
        scratchImg.src = 'Scratch.png';

        function drawCover() {
            const scale = Math.max(canvas.width / scratchImg.width, canvas.height / scratchImg.height);
            const sw = scratchImg.width  * scale;
            const sh = scratchImg.height * scale;
            /* left-aligned: x starts at 0 */
            ctx.drawImage(scratchImg, 0, 0, sw, sh);
        }

        let isScratching = false, revealed = false;
        let lastX = 0, lastY = 0;
        const BRUSH = 90;

        const getPos = e => {
            const r = canvas.getBoundingClientRect();
            return e.touches
                ? { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top }
                : { x: e.clientX - r.left, y: e.clientY - r.top };
        };

        function startScratch(e) {
            isScratching = true;
            const p = getPos(e);
            lastX = p.x; lastY = p.y;
            doScratch(e);
            hintL.classList.add('hidden');
            hintR.classList.add('hidden');
        }

        function doScratch(e) {
            if (!isScratching) return;
            const { x, y } = getPos(e);

            /* ── Yellow circle that STAYS (source-over, not destination-out for colour) ──
               Step 1: draw yellow on a temp off-screen canvas concept —
               Actually: erase image, then fill erased area with yellow, then the navy
               body shows through. We do this by:
               1) destination-out to erase the image
               2) Then draw a yellow filled circle in normal mode on top (stays visible)
            */

            // Step 1 — erase scratch layer
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = BRUSH * 2;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            const erase = ctx.createRadialGradient(x, y, 0, x, y, BRUSH);
            erase.addColorStop(0,   'rgba(0,0,0,1)');
            erase.addColorStop(0.75,'rgba(0,0,0,0.9)');
            erase.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.fillStyle = erase;
            ctx.beginPath();
            ctx.arc(x, y, BRUSH, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // Step 2 — paint persistent yellow circle on top
            const yellow = ctx.createRadialGradient(x, y, 0, x, y, BRUSH * 0.6);
            yellow.addColorStop(0,   'rgba(252,210,2,0.75)');
            yellow.addColorStop(0.55,'rgba(252,210,2,0.35)');
            yellow.addColorStop(1,   'rgba(252,210,2,0)');
            ctx.fillStyle = yellow;
            ctx.beginPath();
            ctx.arc(x, y, BRUSH * 0.6, 0, Math.PI * 2);
            ctx.fill();

            lastX = x; lastY = y;

            // 25% threshold → reveal navy page
            const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let t = 0;
            for (let i = 3; i < d.length; i += 4) if (d[i] === 0) t++;
            if ((t / (d.length / 4)) * 100 > 25 && !revealed) doReveal();
        }

        function doReveal() {
            revealed = true;
            canvas.style.transition = 'opacity 1.2s ease';
            canvas.style.opacity = '0';
            setTimeout(() => canvas.style.display = 'none', 1300);
            setTimeout(() => reveals.forEach(el => el && el.classList.add('show')), 350);
        }

        canvas.addEventListener('mousedown',  startScratch);
        canvas.addEventListener('mousemove',  doScratch);
        canvas.addEventListener('mouseup',    () => isScratching = false);
        canvas.addEventListener('mouseleave', () => isScratching = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); startScratch(e); }, { passive: false });
        canvas.addEventListener('touchmove',  e => { e.preventDefault(); doScratch(e); },   { passive: false });
        canvas.addEventListener('touchend',   () => isScratching = false);

        let clicks = 0;
        canvas.addEventListener('click', () => {
            if (++clicks >= 3) doReveal();
            setTimeout(() => clicks = 0, 1000);
        });

        window.addEventListener('resize', () => {
            if (revealed) return;
            const saved = canvas.toDataURL();
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const tmp = new Image();
            tmp.onload = () => ctx.drawImage(tmp, 0, 0);
            tmp.src = saved;
        });
    </script>
</body>
</html>
